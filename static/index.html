<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BH7GUL QSL & Log Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm"></div>

    <header class="bg-blue-900 text-white py-8 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">BH7GUL QSL & Log Management</h1>
            <p class="mt-2 text-blue-200">业余无线电通联日志与卡片收发管理系统</p>
            <div class="mt-3 text-blue-300 text-sm font-mono" id="clocks"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Search Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">呼号查询</h2>
            <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="searchInput" placeholder="请输入呼号（如 BH7GUL）"
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition min-h-[44px] sm:w-auto w-full">查询</button>
            </form>
            <div id="searchResult" class="mt-4 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-2">查询结果</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="px-4 py-2">呼号</th>
                                <th class="px-4 py-2">日期</th>
                                <th class="px-4 py-2">时间</th>
                                <th class="px-4 py-2">频率</th>
                                <th class="px-4 py-2">模式</th>
                                <th class="px-4 py-2">类型</th>
                                <th class="px-4 py-2">RST发送</th>
                                <th class="px-4 py-2">RST接收</th>
                                <th class="px-4 py-2">卡片状态</th>
                            </tr>
                        </thead>
                        <tbody id="searchTableBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- 搜索分页 -->
            <div id="searchPagination" class="flex items-center justify-between mt-4 text-sm hidden">
                <span id="searchPaginationInfo" class="text-gray-500"></span>
                <div class="flex gap-2" id="searchPaginationButtons"></div>
            </div>
        </section>

        <!-- Recent Logs Section -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">最近通联记录</h2>
            <!-- 筛选控件 -->
            <div class="flex flex-wrap gap-3 mb-4 items-end">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">波段</label>
                    <select id="filterBand" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option>160m</option><option>80m</option><option>60m</option>
                        <option>40m</option><option>30m</option><option>20m</option>
                        <option>17m</option><option>15m</option><option>12m</option>
                        <option>10m</option><option>6m</option><option>2m</option>
                        <option>70cm</option><option>23cm</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">模式</label>
                    <select id="filterMode" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option>SSB</option><option>CW</option><option>FT8</option>
                        <option>FT4</option><option>FM</option><option>AM</option>
                        <option>PSK31</option><option>RTTY</option><option>JS8</option>
                        <option>SSTV</option><option>DIGITAL</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">类型</label>
                    <select id="filterQsoType" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option value="NORMAL">一般通联</option>
                        <option value="SAT">卫星通联 🛰</option>
                        <option value="REP">中继通联 📡</option>
                    </select>
                </div>
                <button id="filterApply" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">筛选</button>
                <button id="filterClear" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition text-sm">清除</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-4 py-2">呼号</th>
                            <th class="px-4 py-2">日期</th>
                            <th class="px-4 py-2">时间</th>
                            <th class="px-4 py-2">频率</th>
                            <th class="px-4 py-2">模式</th>
                            <th class="px-4 py-2">类型</th>
                            <th class="px-4 py-2">RST发送</th>
                            <th class="px-4 py-2">RST接收</th>
                            <th class="px-4 py-2">卡片状态</th>
                        </tr>
                    </thead>
                    <tbody id="recentTableBody"></tbody>
                </table>
            </div>
            <!-- 最近通联分页 -->
            <div id="recentPagination" class="flex items-center justify-between mt-4 text-sm hidden">
                <span id="recentPaginationInfo" class="text-gray-500"></span>
                <div class="flex gap-2" id="recentPaginationButtons"></div>
            </div>
            <div id="noRecentData" class="text-center text-gray-500 py-8 hidden">暂无通联记录</div>
        </section>
    </main>

    <footer class="text-center text-gray-500 py-6 text-sm px-4">
        <a href="https://github.com/bsxiaocai/LiteQSL-Web" target="_blank" class="hover:text-blue-600">LiteQSL-Web</a>
        &copy; 2026 | Powered by FastAPI + SQLite |
        <a href="https://blog.bh7gul.top" target="_blank" class="hover:text-blue-600">访问主站</a>
    </footer>

    <script>
        // ===== 常量定义 =====
        const QSO_TYPE_LABELS = { 'NORMAL': '一般通联', 'SAT': '卫星通联', 'REP': '中继通联' };
        const QSO_TYPE_ICONS = { 'NORMAL': '', 'SAT': '🛰', 'REP': '📡' };
        const BAND_FREQ = {
            '160m': '1.800-2.000', '80m': '3.500-3.900', '60m': '5.300-5.400',
            '40m': '7.000-7.300', '30m': '10.100-10.150', '20m': '14.000-14.350',
            '17m': '18.068-18.168', '15m': '21.000-21.450', '12m': '24.890-24.990',
            '10m': '28.000-29.700', '6m': '50.000-54.000', '2m': '144.000-148.000',
            '70cm': '430.000-440.000', '23cm': '1240.000-1300.000'
        };

        // ===== Toast 通知系统 =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const colors = {
                success: 'bg-green-50 border-green-400 text-green-800',
                error: 'bg-red-50 border-red-400 text-red-800',
                warning: 'bg-yellow-50 border-yellow-400 text-yellow-800',
                info: 'bg-blue-50 border-blue-400 text-blue-800',
            };
            const icons = { success: '✓', error: '✗', warning: '⚠', info: 'ℹ' };
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border-l-4 shadow-lg ${colors[type]} transform translate-x-full opacity-0 transition-all duration-300`;
            toast.innerHTML = `<span class="text-lg">${icons[type]}</span><span class="flex-1 text-sm">${message}</span><button onclick="this.parentElement.remove()" class="text-current opacity-50 hover:opacity-100 text-lg leading-none">&times;</button>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function statusColor(s) {
            const map = { '已发送': 'bg-green-100 text-green-800', '未发送': 'bg-yellow-100 text-yellow-800', '电子确认': 'bg-blue-100 text-blue-800', '无需发送': 'bg-gray-100 text-gray-600', '无法考证': 'bg-red-100 text-red-800' };
            return map[s] || 'bg-gray-100 text-gray-600';
        }

        // 格式化频率显示
        function formatFreqDisplay(log) {
            if (log.freq) return log.freq + ' MHz';
            if (log.band && BAND_FREQ[log.band]) return BAND_FREQ[log.band] + ' MHz';
            return log.band || '-';
        }

        // 格式化类型标签
        function formatTypeBadge(qsoType) {
            const type = qsoType || 'NORMAL';
            const label = QSO_TYPE_LABELS[type] || '一般通联';
            const icon = QSO_TYPE_ICONS[type] || '';
            if (type === 'SAT') {
                return `<span class="px-2 py-1 rounded-full text-xs bg-purple-100 text-purple-700">${icon} ${label}</span>`;
            } else if (type === 'REP') {
                return `<span class="px-2 py-1 rounded-full text-xs bg-orange-100 text-orange-700">${icon} ${label}</span>`;
            }
            // NORMAL 不显示标签，保持简洁
            return '';
        }

        // 格式化频率单元格（考虑 QSO 类型）
        function formatFreqCell(log) {
            const qsoType = log.qso_type || 'NORMAL';

            if (qsoType === 'SAT') {
                // 卫星通联：显示上下行频率
                let html = '';
                if (log.sat_name) {
                    html += `<div class="text-purple-600 text-xs font-medium mb-1">🛰 ${log.sat_name}</div>`;
                }
                if (log.tx_freq && log.rx_freq) {
                    html += `<div class="text-xs">${log.tx_freq} ↑ / ${log.rx_freq} ↓</div>`;
                } else if (log.freq) {
                    html += `<div class="text-xs">${log.freq} MHz</div>`;
                } else if (log.band) {
                    html += `<div class="text-xs">${log.band}</div>`;
                } else {
                    html = '-';
                }
                return html;
            } else if (qsoType === 'REP') {
                // 中继通联：显示输入输出频率
                let html = '';
                if (log.tx_freq && log.rx_freq) {
                    const diff = (parseFloat(log.rx_freq) - parseFloat(log.tx_freq)).toFixed(1);
                    const sign = diff >= 0 ? '+' : '';
                    html += `<div class="text-xs">${log.rx_freq} (${sign}${diff}MHz)</div>`;
                } else if (log.freq) {
                    html += `<div class="text-xs">${log.freq} MHz</div>`;
                } else if (log.band) {
                    html += `<div class="text-xs">${log.band}</div>`;
                } else {
                    html = '-';
                }
                return html;
            }

            // 一般通联：显示频率
            return `<span>${formatFreqDisplay(log)}</span>`;
        }

        function rowHtml(log) {
            return `<tr class="border-b hover:bg-gray-50">
                <td class="px-4 py-2 font-medium">${log.call}</td>
                <td class="px-4 py-2">${log.qso_date || '-'}</td>
                <td class="px-4 py-2">${log.time_on || '-'}</td>
                <td class="px-4 py-2 text-gray-600">${formatFreqCell(log)}</td>
                <td class="px-4 py-2">${log.mode || '-'}</td>
                <td class="px-4 py-2">${formatTypeBadge(log.qso_type)}</td>
                <td class="px-4 py-2">${log.rst_sent || '-'}</td>
                <td class="px-4 py-2">${log.rst_rcvd || '-'}</td>
                <td class="px-4 py-2"><span class="px-2 py-1 rounded-full text-xs ${statusColor(log.qsl_status)}">${log.qsl_status}</span></td>
            </tr>`;
        }

        // ===== 分页状态 =====
        let recentPage = 1, searchPage = 1, lastSearchCall = '', lastRecentBand = '', lastRecentMode = '', lastRecentQsoType = '';

        // ===== 通用分页渲染 =====
        function renderPagination(containerId, infoId, data, goFn) {
            const container = document.getElementById(containerId);
            const info = document.getElementById(infoId);
            const totalPages = Math.ceil(data.total / data.page_size);
            if (data.total === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            info.textContent = `共 ${data.total} 条，第 ${data.page}/${totalPages} 页`;
            const btnContainer = container.querySelector('.flex.gap-2');
            let html = '';
            if (data.page > 1) html += `<button onclick="${goFn}(${data.page - 1})" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>`;
            let startPage = Math.max(1, data.page - 3), endPage = Math.min(totalPages, startPage + 6);
            if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="${goFn}(${i})" class="px-3 py-1 border rounded ${i === data.page ? 'bg-blue-600 text-white' : 'hover:bg-gray-50'}">${i}</button>`;
            }
            if (data.page < totalPages) html += `<button onclick="${goFn}(${data.page + 1})" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>`;
            btnContainer.innerHTML = html;
        }

        // ===== 分页加载最近通联 =====
        function loadRecent(band, mode, qsoType, page) {
            page = page || 1; recentPage = page;
            lastRecentBand = band || ''; lastRecentMode = mode || ''; lastRecentQsoType = qsoType || '';
            const params = new URLSearchParams();
            if (band) params.set('band', band);
            if (mode) params.set('mode', mode);
            if (qsoType) params.set('qso_type', qsoType);
            params.set('page', page); params.set('page_size', 20);
            fetch(`/api/recent?${params}`).then(r => r.json()).then(data => {
                const tbody = document.getElementById('recentTableBody');
                const noData = document.getElementById('noRecentData');
                if (data.logs.length === 0) { noData.classList.remove('hidden'); tbody.innerHTML = ''; document.getElementById('recentPagination').classList.add('hidden'); return; }
                noData.classList.add('hidden');
                tbody.innerHTML = data.logs.map(rowHtml).join('');
                renderPagination('recentPagination', 'recentPaginationInfo', data, 'goRecentPage');
            }).catch(() => { document.getElementById('noRecentData').classList.remove('hidden'); });
        }
        function goRecentPage(page) { loadRecent(lastRecentBand, lastRecentMode, lastRecentQsoType, page); }

        // ===== 分页搜索 =====
        function loadSearch(call, page) {
            page = page || 1; searchPage = page; lastSearchCall = call;
            const params = new URLSearchParams();
            params.set('call', call); params.set('page', page); params.set('page_size', 20);
            fetch(`/api/search?${params}`).then(r => r.json()).then(data => {
                const resultDiv = document.getElementById('searchResult');
                const tbody = document.getElementById('searchTableBody');
                resultDiv.classList.remove('hidden');
                if (data.logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-4 text-center text-gray-500">未找到相关记录</td></tr>';
                    document.getElementById('searchPagination').classList.add('hidden');
                } else {
                    tbody.innerHTML = data.logs.map(rowHtml).join('');
                    renderPagination('searchPagination', 'searchPaginationInfo', data, 'goSearchPage');
                }
            }).catch(() => showToast('查询失败，请重试', 'error'));
        }
        function goSearchPage(page) { loadSearch(lastSearchCall, page); }

        // ===== 初始化加载 =====
        loadRecent();

        // ===== 筛选控件事件 =====
        document.getElementById('filterApply').addEventListener('click', function() {
            loadRecent(
                document.getElementById('filterBand').value,
                document.getElementById('filterMode').value,
                document.getElementById('filterQsoType').value,
                1
            );
        });
        document.getElementById('filterClear').addEventListener('click', function() {
            document.getElementById('filterBand').value = '';
            document.getElementById('filterMode').value = '';
            document.getElementById('filterQsoType').value = '';
            loadRecent('', '', '', 1);
        });

        // ===== 搜索 =====
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const call = document.getElementById('searchInput').value.trim();
            if (!call) return;
            loadSearch(call, 1);
        });

        // ===== 时钟 =====
        function updateClocks() {
            const now = new Date();
            const fmt = (tz) => { const d = new Date(now.toLocaleString('en-US', {timeZone: tz})); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':'); };
            document.getElementById('clocks').textContent = `北京时间 ${fmt('Asia/Shanghai')}  |  UTC ${fmt('UTC')}`;
        }
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
