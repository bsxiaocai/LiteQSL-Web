<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSL & Log Management</title>
    <script src="/static/css/tailwind.js"></script>
    <style>
        /* 表格响应式样式 */
        .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .overflow-x-auto::-webkit-scrollbar {
            height: 6px;
        }
        .overflow-x-auto::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        .overflow-x-auto::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        .overflow-x-auto::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
        /* 单元格内容溢出时显示省略号 */
        td {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 表头样式 */
        th {
            background-color: #f9fafb;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm"></div>

    <header class="bg-blue-900 text-white py-8 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 id="stationTitle" class="text-2xl sm:text-3xl font-bold tracking-wide">QSL & Log Management</h1>
            <p class="mt-2 text-blue-200">业余无线电通联日志与卡片收发管理系统</p>
            <div class="mt-3 text-blue-300 text-sm font-mono" id="clocks"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Search Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">通联查询</h2>
            <form id="searchForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">呼号</label>
                        <input type="text" id="searchInput" placeholder="请输入呼号"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">波段</label>
                        <select id="searchBand" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">全部</option>
                            <option>160m</option><option>80m</option><option>60m</option>
                            <option>40m</option><option>30m</option><option>20m</option>
                            <option>17m</option><option>15m</option><option>12m</option>
                            <option>10m</option><option>6m</option><option>2m</option>
                            <option>70cm</option><option>23cm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">模式</label>
                        <select id="searchMode" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">全部</option>
                            <option>SSB</option><option>CW</option><option>FT8</option>
                            <option>FT4</option><option>FM</option><option>AM</option>
                            <option>PSK31</option><option>RTTY</option><option>JS8</option>
                            <option>SSTV</option><option>DIGITAL</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="submit"
                            class="w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition min-h-[44px]">查询</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">起始日期</label>
                        <input type="date" id="searchDateFrom"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">结束日期</label>
                        <input type="date" id="searchDateTo"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </form>
            <div id="searchResult" class="mt-4 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-2">查询结果</h3>
                <div class="overflow-x-auto -mx-6 px-6">
                    <table class="w-full text-sm text-left" style="min-width: 700px;">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="px-3 py-2 text-center whitespace-nowrap">呼号</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">日期</th>
                                <th class="visitor-timezone-label px-3 py-2 text-center whitespace-nowrap">时间（北京时间）</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">频率</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">模式</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">类型</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">RST发送</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">RST接收</th>
                                <th class="px-3 py-2 text-center whitespace-nowrap">卡片状态</th>
                            </tr>
                        </thead>
                        <tbody id="searchTableBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- 搜索分页 -->
            <div id="searchPagination" class="flex items-center justify-between mt-4 text-sm hidden">
                <span id="searchPaginationInfo" class="text-gray-500"></span>
                <div class="flex gap-2" id="searchPaginationButtons"></div>
            </div>
        </section>

        <!-- Recent Logs Section -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">最近通联记录</h2>
            <!-- 筛选控件 -->
            <div class="flex flex-wrap gap-3 mb-4 items-end">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">波段</label>
                    <select id="filterBand" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option>160m</option><option>80m</option><option>60m</option>
                        <option>40m</option><option>30m</option><option>20m</option>
                        <option>17m</option><option>15m</option><option>12m</option>
                        <option>10m</option><option>6m</option><option>2m</option>
                        <option>70cm</option><option>23cm</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">模式</label>
                    <select id="filterMode" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option>SSB</option><option>CW</option><option>FT8</option>
                        <option>FT4</option><option>FM</option><option>AM</option>
                        <option>PSK31</option><option>RTTY</option><option>JS8</option>
                        <option>SSTV</option><option>DIGITAL</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">类型</label>
                    <select id="filterQsoType" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部</option>
                        <option value="NORMAL">一般通联</option>
                        <option value="SAT">卫星通联 🛰</option>
                        <option value="REP">中继通联 📡</option>
                        <option value="EYEBALL">Eyeball QSO 👀</option>
                    </select>
                </div>
                <button id="filterApply" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">筛选</button>
                <button id="filterClear" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition text-sm">清除</button>
            </div>
            <div class="overflow-x-auto -mx-6 px-6">
                <table class="w-full text-sm text-left" style="min-width: 700px;">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-3 py-2 text-center whitespace-nowrap">呼号</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">日期</th>
                            <th class="visitor-timezone-label px-3 py-2 text-center whitespace-nowrap">时间（北京时间）</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">频率</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">模式</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">类型</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">RST发送</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">RST接收</th>
                            <th class="px-3 py-2 text-center whitespace-nowrap">卡片状态</th>
                        </tr>
                    </thead>
                    <tbody id="recentTableBody"></tbody>
                </table>
            </div>
            <!-- 最近通联分页 -->
            <div id="recentPagination" class="flex items-center justify-between mt-4 text-sm hidden">
                <span id="recentPaginationInfo" class="text-gray-500"></span>
                <div class="flex gap-2" id="recentPaginationButtons"></div>
            </div>
            <div id="noRecentData" class="text-center text-gray-500 py-8 hidden">暂无通联记录</div>
        </section>
    </main>

    <footer class="text-center text-gray-500 py-6 text-sm px-4">
        <a href="https://github.com/bsxiaocai/LiteQSL-Web" target="_blank" class="hover:text-blue-600">LiteQSL-Web</a>
        &copy; 2026 | Powered by FastAPI + SQLite |
        <a href="https://blog.bh7gul.top" target="_blank" class="hover:text-blue-600">访问主站</a>
    </footer>

    <script type="module">
        import { init } from '/static/js/public/app.js';
        init();
    </script>
</body>
</html>
