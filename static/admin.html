<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - LiteQSL-Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Login Page -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">管理员登录</h1>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">用户名</label>
                    <input type="text" id="loginUsername" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">密码</label>
                    <input type="password" id="loginPassword" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">登录</button>
                <p id="loginError" class="text-red-500 text-sm mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminPage" class="hidden">
        <header class="bg-blue-900 text-white py-4 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">LiteQSL-Web 管理后台</h1>
                <div class="flex items-center gap-4">
                    <a href="/" class="text-blue-200 hover:text-white text-sm">返回首页</a>
                    <button id="changePwdBtn" class="text-blue-200 hover:text-white text-sm">修改密码</button>
                    <button id="logoutBtn" class="text-blue-200 hover:text-white text-sm">退出登录</button>
                </div>
            </div>
            <div class="max-w-7xl mx-auto px-4 mt-2">
                <div class="text-blue-300 text-sm font-mono" id="clocks"></div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
            <!-- Manual Entry -->
            <section class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">手动录入 QSO</h2>
                <form id="addForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">呼号 *</label>
                        <input type="text" name="call" required placeholder="BH7GUL"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">日期 (YYYYMMDD)</label>
                        <input type="text" name="qso_date" placeholder="20260528"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">时间 (HHMMSS)</label>
                        <input type="text" name="time_on" placeholder="143025"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">波段</label>
                        <select id="bandSelect" name="band"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">--</option>
                            <option>160m</option><option>80m</option><option>60m</option>
                            <option>40m</option><option>30m</option><option>20m</option>
                            <option>17m</option><option>15m</option><option>12m</option>
                            <option>10m</option><option>6m</option><option>2m</option>
                            <option>70cm</option><option>23cm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">频率 (MHz)</label>
                        <input type="text" id="freqInput" placeholder="如 14.1"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">模式</label>
                        <select name="mode"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">--</option>
                            <option>SSB</option><option>CW</option><option>FT8</option>
                            <option>FT4</option><option>FM</option><option>AM</option>
                            <option>PSK31</option><option>RTTY</option><option>JS8</option>
                            <option>SSTV</option><option>DIGITAL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">RST 发送</label>
                        <input type="text" name="rst_sent" placeholder="59"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">RST 接收</label>
                        <input type="text" name="rst_rcvd" placeholder="59"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">卡片状态</label>
                        <select name="qsl_status"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option>未发送</option><option>已发送</option>
                            <option>无需发送</option><option>电子确认</option>
                            <option>无法考证</option>
                        </select>
                    </div>
                    <div class="md:col-span-2 lg:col-span-3">
                        <label class="block text-sm text-gray-600 mb-1">备注</label>
                        <input type="text" name="comment"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="flex items-end">
                        <button type="submit"
                            class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">添加记录</button>
                    </div>
                </form>
            </section>

            <!-- ADIF Import/Export -->
            <section class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">ADIF 导入 / 导出</h2>
                <div class="flex flex-col sm:flex-row gap-4 items-start">
                    <form id="importForm" class="flex-1 flex gap-3 items-end">
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">选择 .adi 文件</label>
                            <input type="file" id="adifFile" accept=".adi,.adif"
                                class="w-full border rounded-lg px-3 py-2 text-sm">
                        </div>
                        <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition whitespace-nowrap">导入</button>
                    </form>
                    <button id="exportBtn"
                        class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition whitespace-nowrap">
                        导出 ADIF
                    </button>
                    <button id="exportCsvBtn"
                        class="bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700 transition whitespace-nowrap">
                        导出 CSV
                    </button>
                </div>
                <p id="importResult" class="text-sm mt-2 hidden"></p>
            </section>

            <!-- Logs Table -->
            <section class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">记录管理</h2>
                <!-- 筛选控件 -->
                <div class="flex flex-wrap gap-3 mb-4 items-end">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">呼号搜索</label>
                        <input type="text" id="filterCall" placeholder="呼号"
                            class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">波段</label>
                        <select id="filterBand" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">全部</option>
                            <option>160m</option><option>80m</option><option>60m</option>
                            <option>40m</option><option>30m</option><option>20m</option>
                            <option>17m</option><option>15m</option><option>12m</option>
                            <option>10m</option><option>6m</option><option>2m</option>
                            <option>70cm</option><option>23cm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">模式</label>
                        <select id="filterMode" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">全部</option>
                            <option>SSB</option><option>CW</option><option>FT8</option>
                            <option>FT4</option><option>FM</option><option>AM</option>
                            <option>PSK31</option><option>RTTY</option><option>JS8</option>
                            <option>SSTV</option><option>DIGITAL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">卡片状态</label>
                        <select id="filterStatus" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">全部</option>
                            <option>未发送</option><option>已发送</option>
                            <option>无需发送</option><option>电子确认</option>
                            <option>无法考证</option>
                        </select>
                    </div>
                    <button id="filterApply" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">筛选</button>
                    <button id="filterClear" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition text-sm">清除</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="px-3 py-2">ID</th>
                                <th class="px-3 py-2">呼号</th>
                                <th class="px-3 py-2">日期</th>
                                <th class="px-3 py-2">时间</th>
                                <th class="px-3 py-2">波段</th>
                                <th class="px-3 py-2">频率</th>
                                <th class="px-3 py-2">模式</th>
                                <th class="px-3 py-2">RST</th>
                                <th class="px-3 py-2">卡片状态</th>
                                <th class="px-3 py-2">操作</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody"></tbody>
                    </table>
                </div>
                <!-- 分页控件 -->
                <div id="pagination" class="flex items-center justify-between mt-4 text-sm">
                    <span id="paginationInfo" class="text-gray-500"></span>
                    <div class="flex gap-2" id="paginationButtons"></div>
                </div>
                <div id="noLogs" class="text-center text-gray-500 py-8 hidden">暂无记录</div>
            </section>
        </main>

        <footer class="text-center text-gray-500 py-6 text-sm">
            <a href="https://github.com/bsxiaocai/LiteQSL-Web" target="_blank" class="hover:text-blue-600">LiteQSL-Web</a>
            &copy; 2026 | Powered by FastAPI + SQLite |
            <a href="https://blog.bh7gul.top" target="_blank" class="hover:text-blue-600">访问主站</a>
        </footer>
    </div>

    <!-- Change Password Modal -->
    <div id="pwdModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-sm">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">修改密码</h2>
            <form id="changePwdForm">
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">旧密码</label>
                    <input type="password" id="oldPassword" required
                        class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">新密码</label>
                    <input type="password" id="newPassword" required
                        class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1">至少 8 位，需包含大写字母、小写字母、数字、符号中的至少三类</p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1">确认新密码</label>
                    <input type="password" id="confirmPassword" required
                        class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <p id="pwdError" class="text-red-500 text-sm mb-3 hidden"></p>
                <p id="pwdSuccess" class="text-green-600 text-sm mb-3 hidden"></p>
                <div class="flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">确认修改</button>
                    <button type="button" id="pwdModalClose"
                        class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑记录弹窗 -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">编辑记录</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">呼号 *</label>
                        <input type="text" id="editCall" required
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">日期 (YYYYMMDD)</label>
                        <input type="text" id="editQsoDate"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">时间 (HHMMSS)</label>
                        <input type="text" id="editTimeOn"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">波段</label>
                        <select id="editBand"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">--</option>
                            <option>160m</option><option>80m</option><option>60m</option>
                            <option>40m</option><option>30m</option><option>20m</option>
                            <option>17m</option><option>15m</option><option>12m</option>
                            <option>10m</option><option>6m</option><option>2m</option>
                            <option>70cm</option><option>23cm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">频率 (MHz)</label>
                        <input type="text" id="editFreq"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">模式</label>
                        <select id="editMode"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">--</option>
                            <option>SSB</option><option>CW</option><option>FT8</option>
                            <option>FT4</option><option>FM</option><option>AM</option>
                            <option>PSK31</option><option>RTTY</option><option>JS8</option>
                            <option>SSTV</option><option>DIGITAL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">RST 发送</label>
                        <input type="text" id="editRstSent"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">RST 接收</label>
                        <input type="text" id="editRstRcvd"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">卡片状态</label>
                        <select id="editQslStatus"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option>未发送</option><option>已发送</option>
                            <option>无需发送</option><option>电子确认</option>
                            <option>无法考证</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm text-gray-600 mb-1">备注</label>
                        <input type="text" id="editComment"
                            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <p id="editError" class="text-red-500 text-sm mb-3 hidden"></p>
                <div class="flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">保存修改</button>
                    <button type="button" id="editModalClose"
                        class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STATUS_OPTIONS = ['无法考证', '未发送', '已发送', '无需发送', '电子确认'];
        const BAND_FREQ = {
            '160m': '1.800-2.000', '80m': '3.500-3.900', '60m': '5.300-5.400',
            '40m': '7.000-7.300', '30m': '10.100-10.150', '20m': '14.000-14.350',
            '17m': '18.068-18.168', '15m': '21.000-21.450', '12m': '24.890-24.990',
            '10m': '28.000-29.700', '6m': '50.000-54.000', '2m': '144.000-148.000',
            '70cm': '430.000-440.000', '23cm': '1240.000-1300.000'
        };
        function bandFreq(band) { return band ? (BAND_FREQ[band] || band) + ' MHz' : '-'; }

        function freqToBand(freq) {
            const f = parseFloat(freq);
            if (isNaN(f)) return '';
            if (f >= 1.8 && f < 2.0) return '160m';
            if (f >= 3.5 && f < 4.0) return '80m';
            if (f >= 5.3 && f < 5.4) return '60m';
            if (f >= 7.0 && f < 7.3) return '40m';
            if (f >= 10.1 && f < 10.15) return '30m';
            if (f >= 14.0 && f < 14.35) return '20m';
            if (f >= 18.068 && f < 18.168) return '17m';
            if (f >= 21.0 && f < 21.45) return '15m';
            if (f >= 24.89 && f < 25.0) return '12m';
            if (f >= 28.0 && f < 29.7) return '10m';
            if (f >= 50.0 && f < 54.0) return '6m';
            if (f >= 144.0 && f < 148.0) return '2m';
            if (f >= 430.0 && f < 440.0) return '70cm';
            if (f >= 1240.0 && f < 1300.0) return '23cm';
            return '';
        }

        // ===== 频率 <-> 波段联动（录入表单）=====
        document.getElementById('freqInput').addEventListener('input', function() {
            const band = freqToBand(this.value);
            if (band) document.getElementById('bandSelect').value = band;
        });
        document.getElementById('bandSelect').addEventListener('change', function() {
            if (this.value && BAND_FREQ[this.value]) {
                document.getElementById('freqInput').value = BAND_FREQ[this.value].split('-')[0];
            }
        });

        // ===== 频率 <-> 波段联动（编辑弹窗）=====
        document.getElementById('editFreq').addEventListener('input', function() {
            const band = freqToBand(this.value);
            if (band) document.getElementById('editBand').value = band;
        });
        document.getElementById('editBand').addEventListener('change', function() {
            if (this.value && BAND_FREQ[this.value]) {
                document.getElementById('editFreq').value = BAND_FREQ[this.value].split('-')[0];
            }
        });

        // ===== 登录状态检查 =====
        fetch('/api/admin/check').then(r => r.json()).then(data => {
            if (data.logged_in) showAdmin();
        });

        // ===== 登录 =====
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            }).then(r => {
                if (r.ok) { showAdmin(); }
                else {
                    r.json().then(data => {
                        document.getElementById('loginError').textContent = data.detail || '登录失败';
                        document.getElementById('loginError').classList.remove('hidden');
                    });
                }
            });
        });

        // ===== 退出登录 =====
        document.getElementById('logoutBtn').addEventListener('click', function() {
            fetch('/api/admin/logout', {method: 'POST'}).then(() => location.reload());
        });

        // ===== 修改密码弹窗 =====
        document.getElementById('changePwdBtn').addEventListener('click', function() {
            document.getElementById('pwdModal').classList.remove('hidden');
            document.getElementById('pwdError').classList.add('hidden');
            document.getElementById('pwdSuccess').classList.add('hidden');
            document.getElementById('changePwdForm').reset();
        });
        document.getElementById('pwdModalClose').addEventListener('click', function() {
            document.getElementById('pwdModal').classList.add('hidden');
        });
        document.getElementById('changePwdForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('pwdError');
            const okEl = document.getElementById('pwdSuccess');
            errEl.classList.add('hidden');
            okEl.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errEl.textContent = '两次输入的新密码不一致';
                errEl.classList.remove('hidden');
                return;
            }
            if (newPassword.length < 8) {
                errEl.textContent = '密码长度至少为 8 位';
                errEl.classList.remove('hidden');
                return;
            }
            let cats = 0;
            if (/[A-Z]/.test(newPassword)) cats++;
            if (/[a-z]/.test(newPassword)) cats++;
            if (/[0-9]/.test(newPassword)) cats++;
            if (/[^A-Za-z0-9]/.test(newPassword)) cats++;
            if (cats < 3) {
                errEl.textContent = '密码需包含大写字母、小写字母、数字、符号中的至少三类';
                errEl.classList.remove('hidden');
                return;
            }

            fetch('/api/admin/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({old_password: oldPassword, new_password: newPassword})
            }).then(r => r.json().then(data => {
                if (r.ok) {
                    okEl.textContent = '密码修改成功，请重新登录';
                    okEl.classList.remove('hidden');
                    setTimeout(() => { location.reload(); }, 1500);
                } else {
                    errEl.textContent = data.detail || '修改失败';
                    errEl.classList.remove('hidden');
                }
            }));
        });

        // ===== 显示管理后台 =====
        function showAdmin() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            loadLogs();
        }

        // ===== 分页与筛选状态 =====
        let currentPage = 1;
        let currentFilters = {};
        let allLogs = [];

        // ===== 加载通联记录（分页+筛选）=====
        function loadLogs() {
            const params = new URLSearchParams();
            params.set('page', currentPage);
            params.set('page_size', 50);
            if (currentFilters.call) params.set('call', currentFilters.call);
            if (currentFilters.band) params.set('band', currentFilters.band);
            if (currentFilters.mode) params.set('mode', currentFilters.mode);
            if (currentFilters.qsl_status) params.set('qsl_status', currentFilters.qsl_status);

            fetch(`/api/admin/logs?${params}`).then(r => r.json()).then(data => {
                allLogs = data.logs;
                renderLogsTable(data);
                renderPagination(data);
            });
        }

        // ===== 渲染记录表格 =====
        function renderLogsTable(data) {
            const tbody = document.getElementById('logsTableBody');
            const noLogs = document.getElementById('noLogs');
            if (data.logs.length === 0) {
                noLogs.classList.remove('hidden');
                tbody.innerHTML = '';
                return;
            }
            noLogs.classList.add('hidden');
            tbody.innerHTML = data.logs.map(log => {
                const statusOpts = STATUS_OPTIONS.map(s =>
                    `<option value="${s}" ${s === log.qsl_status ? 'selected' : ''}>${s}</option>`
                ).join('');
                return `<tr class="border-b hover:bg-gray-50">
                    <td class="px-3 py-2 text-gray-500">${log.id}</td>
                    <td class="px-3 py-2 font-medium">${log.call}</td>
                    <td class="px-3 py-2">${log.qso_date || '-'}</td>
                    <td class="px-3 py-2">${log.time_on || '-'}</td>
                    <td class="px-3 py-2">${log.band || '-'}</td>
                    <td class="px-3 py-2 text-gray-600">${bandFreq(log.band)}</td>
                    <td class="px-3 py-2">${log.mode || '-'}</td>
                    <td class="px-3 py-2">${log.rst_sent || '-'} / ${log.rst_rcvd || '-'}</td>
                    <td class="px-3 py-2">
                        <select onchange="updateStatus(${log.id}, this.value)"
                            class="border rounded px-2 py-1 text-xs">${statusOpts}</select>
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap">
                        <button onclick="openEditModal(${log.id})"
                            class="text-blue-600 hover:text-blue-800 text-xs mr-2">编辑</button>
                        <button onclick="deleteLog(${log.id})"
                            class="text-red-600 hover:text-red-800 text-xs">删除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        // ===== 渲染分页控件 =====
        function renderPagination(data) {
            const totalPages = Math.ceil(data.total / data.page_size);
            const info = document.getElementById('paginationInfo');
            const btns = document.getElementById('paginationButtons');
            if (data.total === 0) {
                info.textContent = '';
                btns.innerHTML = '';
                return;
            }
            info.textContent = `共 ${data.total} 条记录，第 ${data.page}/${totalPages} 页`;

            let html = '';
            if (data.page > 1) {
                html += `<button onclick="goToPage(${data.page - 1})" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>`;
            }
            // 页码按钮（最多显示7个）
            let startPage = Math.max(1, data.page - 3);
            let endPage = Math.min(totalPages, startPage + 6);
            if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);
            for (let i = startPage; i <= endPage; i++) {
                const active = i === data.page ? 'bg-blue-600 text-white' : 'hover:bg-gray-50';
                html += `<button onclick="goToPage(${i})" class="px-3 py-1 border rounded ${active}">${i}</button>`;
            }
            if (data.page < totalPages) {
                html += `<button onclick="goToPage(${data.page + 1})" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>`;
            }
            btns.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadLogs();
        }

        // ===== 筛选控件 =====
        document.getElementById('filterApply').addEventListener('click', function() {
            currentFilters = {
                call: document.getElementById('filterCall').value.trim(),
                band: document.getElementById('filterBand').value,
                mode: document.getElementById('filterMode').value,
                qsl_status: document.getElementById('filterStatus').value,
            };
            currentPage = 1;
            loadLogs();
        });
        document.getElementById('filterClear').addEventListener('click', function() {
            document.getElementById('filterCall').value = '';
            document.getElementById('filterBand').value = '';
            document.getElementById('filterMode').value = '';
            document.getElementById('filterStatus').value = '';
            currentFilters = {};
            currentPage = 1;
            loadLogs();
        });

        // ===== 修改卡片状态 =====
        function updateStatus(id, status) {
            fetch(`/api/admin/logs/${id}/status`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({qsl_status: status})
            });
        }

        // ===== 删除记录 =====
        function deleteLog(id) {
            if (!confirm('确定删除这条记录？')) return;
            fetch(`/api/admin/logs/${id}`, {method: 'DELETE'}).then(() => loadLogs());
        }

        // ===== 编辑记录弹窗 =====
        function openEditModal(id) {
            const log = allLogs.find(l => l.id === id);
            if (!log) return;
            document.getElementById('editId').value = log.id;
            document.getElementById('editCall').value = log.call || '';
            document.getElementById('editQsoDate').value = log.qso_date || '';
            document.getElementById('editTimeOn').value = log.time_on || '';
            document.getElementById('editBand').value = log.band || '';
            document.getElementById('editFreq').value = '';
            if (log.band && BAND_FREQ[log.band]) {
                document.getElementById('editFreq').value = BAND_FREQ[log.band].split('-')[0];
            }
            document.getElementById('editMode').value = log.mode || '';
            document.getElementById('editRstSent').value = log.rst_sent || '';
            document.getElementById('editRstRcvd').value = log.rst_rcvd || '';
            document.getElementById('editQslStatus').value = log.qsl_status || '未发送';
            document.getElementById('editComment').value = log.comment || '';
            document.getElementById('editError').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editError').classList.add('hidden');
        }

        document.getElementById('editModalClose').addEventListener('click', closeEditModal);

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {};
            data.call = document.getElementById('editCall').value.trim();
            data.qso_date = document.getElementById('editQsoDate').value.trim();
            data.time_on = document.getElementById('editTimeOn').value.trim();
            data.band = document.getElementById('editBand').value;
            data.mode = document.getElementById('editMode').value;
            data.rst_sent = document.getElementById('editRstSent').value.trim();
            data.rst_rcvd = document.getElementById('editRstRcvd').value.trim();
            data.qsl_status = document.getElementById('editQslStatus').value;
            data.comment = document.getElementById('editComment').value.trim();

            // 频率 -> 波段同步
            const freq = document.getElementById('editFreq').value.trim();
            if (freq) {
                const band = freqToBand(freq);
                if (band) data.band = band;
            }

            // 必填字段校验
            const requiredFields = {call: '呼号', qso_date: '日期', time_on: '时间', mode: '模式', rst_sent: 'RST发送', rst_rcvd: 'RST接收', qsl_status: '卡片状态'};
            const missing = [];
            for (const [k, label] of Object.entries(requiredFields)) {
                if (!data[k]) missing.push(label);
            }
            if (!data.band) missing.push('波段或频率');
            if (missing.length) {
                const errEl = document.getElementById('editError');
                errEl.textContent = '请填写必填字段：' + missing.join('、');
                errEl.classList.remove('hidden');
                return;
            }

            fetch(`/api/admin/logs/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(r => {
                if (r.ok) {
                    closeEditModal();
                    loadLogs();
                } else {
                    r.json().then(result => {
                        const errEl = document.getElementById('editError');
                        errEl.textContent = result.detail || '保存失败';
                        errEl.classList.remove('hidden');
                    });
                }
            });
        });

        // ===== 添加记录 =====
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const data = {};
            new FormData(form).forEach((v, k) => { if (v) data[k] = v; });

            // 频率 -> 波段同步
            const freq = document.getElementById('freqInput').value.trim();
            if (freq) {
                const band = freqToBand(freq);
                if (band) data.band = band;
            }

            // 必填字段校验
            const requiredFields = {call: '呼号', qso_date: '日期', time_on: '时间', mode: '模式', rst_sent: 'RST发送', rst_rcvd: 'RST接收', qsl_status: '卡片状态'};
            const missing = [];
            for (const [k, label] of Object.entries(requiredFields)) {
                if (!data[k]) missing.push(label);
            }
            if (!data.band) missing.push('波段或频率');
            if (missing.length) {
                alert('请填写必填字段：' + missing.join('、'));
                return;
            }

            fetch('/api/admin/logs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(r => {
                if (r.status === 409) {
                    // 重复记录处理
                    r.json().then(result => {
                        if (confirm(result.detail + '\n\n是否强制添加？')) {
                            data.force = true;
                            fetch('/api/admin/logs', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify(data)
                            }).then(r2 => r2.json()).then(() => {
                                form.reset();
                                loadLogs();
                            });
                        }
                    });
                    return;
                }
                return r.json();
            }).then(result => {
                if (result && result.ok) {
                    form.reset();
                    loadLogs();
                }
            });
        });

        // ===== ADIF 导入（含重复检测）=====
        document.getElementById('importForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('adifFile');
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('force', 'false');
            fetch('/api/admin/import-adif', {
                method: 'POST',
                body: formData
            }).then(r => r.json()).then(data => {
                const p = document.getElementById('importResult');
                p.classList.remove('hidden');
                if (data.ok) {
                    p.className = 'text-sm mt-2 text-green-600';
                    p.textContent = `成功导入 ${data.count} 条记录`;
                    loadLogs();
                } else if (data.duplicates && data.duplicates.length > 0) {
                    p.className = 'text-sm mt-2 text-yellow-600';
                    p.innerHTML = `发现 ${data.duplicate_count} 条重复记录（共 ${data.total} 条）。` +
                        `<button onclick="forceImport()" class="ml-2 underline text-blue-600">强制导入全部</button>`;
                } else {
                    p.className = 'text-sm mt-2 text-red-600';
                    p.textContent = data.detail || '导入失败';
                }
            });
        });

        function forceImport() {
            const fileInput = document.getElementById('adifFile');
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('force', 'true');
            fetch('/api/admin/import-adif', {
                method: 'POST',
                body: formData
            }).then(r => r.json()).then(data => {
                const p = document.getElementById('importResult');
                p.classList.remove('hidden');
                if (data.ok) {
                    p.className = 'text-sm mt-2 text-green-600';
                    p.textContent = `成功导入 ${data.count} 条记录`;
                } else {
                    p.className = 'text-sm mt-2 text-red-600';
                    p.textContent = data.detail || '导入失败';
                }
                loadLogs();
            });
        }

        // ===== 导出 ADIF =====
        document.getElementById('exportBtn').addEventListener('click', function() {
            window.location.href = '/api/admin/export-adif';
        });

        // ===== 导出 CSV =====
        document.getElementById('exportCsvBtn').addEventListener('click', function() {
            window.location.href = '/api/admin/export-csv';
        });

        // ===== 时钟 =====
        function updateClocks() {
            const now = new Date();
            const fmt = (tz) => {
                const d = new Date(now.toLocaleString('en-US', {timeZone: tz}));
                return [d.getHours(), d.getMinutes(), d.getSeconds()]
                    .map(n => String(n).padStart(2, '0')).join(':');
            };
            document.getElementById('clocks').textContent =
                `北京时间 ${fmt('Asia/Shanghai')}  |  UTC ${fmt('UTC')}`;
        }
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
