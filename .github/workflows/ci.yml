name: CI

on:
  push:
  pull_request:

jobs:
  # 静态检查 + 单元/集成测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # 多平台交叉编译验证（CGO_ENABLED=0，纯 Go SQLite）
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - windows/amd64
          - darwin/amd64
          - darwin/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cross compile
        env:
          TARGET: ${{ matrix.target }}
        run: |
          os="${TARGET%%/*}"
          arch="${TARGET##*/}"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          [ "$arch" = "arm" ] && export GOARM=7
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/liteqsl-${os}-${arch}${ext}" ./cmd/liteqsl
          ls -lh dist
