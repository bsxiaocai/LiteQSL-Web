# LiteQSL-Web v2 配置示例
# 复制为 config.yaml 后按需修改。所有配置项均可省略，省略时使用默认值。
# 优先级：默认值 < config.yaml < 环境变量。

# 监听地址（环境变量 LITEQSL_HOST）
host: "0.0.0.0"
# 监听端口（环境变量 LITEQSL_PORT）
port: 8000

# SQLite 数据库路径（环境变量 LITEQSL_DB_PATH）
# 默认沿用 v1.x 的 data/qsl.db，旧库可直接复用；
# 若想使用与二进制同目录的布局，可改为 "liteqsl.db"。
db_path: "data/qsl.db"

# 前端静态资源目录（环境变量 LITEQSL_STATIC_DIR）
static_dir: "static"

# 会话签名密钥。留空时自动生成并保存到 data/.secret_key（与 v1.x 一致）。
# 生产环境建议通过环境变量 SECRET_KEY 提供固定随机值。
secret_key: ""

# 是否信任反向代理头 X-Forwarded-For / X-Real-IP（环境变量 TRUST_PROXY）
trust_proxy: false

# 登录失败次数上限（5 次失败后锁定）
login_max_attempts: 5
# 登录锁定秒数
login_lockout_seconds: 600
# 最多保留的备份数量
max_backups: 20

# 会话 Cookie 名与有效期（秒）
session_cookie_name: "session"
session_max_age_seconds: 604800
# 生产环境启用 HTTPS 后可设为 true（强制 Secure 属性）
https_only: false

# 日志级别：debug / info / warn / error（环境变量 LITEQSL_LOG_LEVEL）
log_level: "info"
